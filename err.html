<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Work List</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#111;
            color:#fff;
            font-family:sans-serif;
        }

        .works{
            width:100%;
            padding:120px 5vw;
        }

        .work-item{
            position:relative;

            display:flex;
            align-items:center;
            justify-content:space-between;

            width:100%;

            padding:40px 0;

            text-decoration:none;
            color:white;

            border-bottom:1px solid rgba(255,255,255,.12);

            transition:.4s ease;
        }

        .num{
            width:80px;
            font-size:14px;
            opacity:.5;
        }

        .title{
            flex:1;

            font-size:clamp(42px,6vw,110px);
            font-weight:400;
            line-height:1;

            transition:.5s ease;
        }

        .year{
            width:100px;
            text-align:right;
            opacity:.6;
        }

        .works:hover .work-item{
            opacity:.25;
        }

        .works .work-item:hover{
            opacity:1;
        }

        .work-item:hover .title{
            transform:translateX(30px);
        }

        /* Hover Preview */

        .preview{
            position:fixed;

            width:420px;
            height:520px;

            top:0;
            left:0;

            opacity:0;

            pointer-events:none;

            z-index:9999;

            overflow:hidden;

            border-radius:16px;

            transform:translate(-50%,-50%);
        }

        .preview-inner{
            width:100%;
            height:100%;

            background-size:cover;
            background-position:center;

            transform:scale(1);

            transition:transform .8s ease;
        }

        @media (max-width:768px){

            .preview{
                display:none;
            }

            .title{
                font-size:36px;
            }

            .work-item{
                padding:24px 0;
            }

        }

    </style>
</head>
<body>

<section class="works">

    <a href="#" class="work-item"
       data-img="https://images.unsplash.com/photo-1518005020951-eccb494ad742">

        <span class="num">01</span>
        <h2 class="title">The Soul Of The 911</h2>
        <span class="year">2026</span>

    </a>

    <a href="#" class="work-item"
       data-img="https://images.unsplash.com/photo-1494526585095-c41746248156">

        <span class="num">02</span>
        <h2 class="title">Kora Living</h2>
        <span class="year">2025</span>

    </a>

    <a href="#" class="work-item"
       data-img="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">

        <span class="num">03</span>
        <h2 class="title">The Overshoot</h2>
        <span class="year">2025</span>

    </a>

    <a href="#" class="work-item"
       data-img="https://images.unsplash.com/photo-1511818966892-d7d671e672a2">

        <span class="num">04</span>
        <h2 class="title">Night Shift</h2>
        <span class="year">2024</span>

    </a>

</section>

<div class="preview">
    <div class="preview-inner"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

<script>

    const preview = document.querySelector(".preview");
    const previewInner = document.querySelector(".preview-inner");

    document.querySelectorAll(".work-item").forEach(item => {

        item.addEventListener("mouseenter", () => {

            const img = item.dataset.img;

            previewInner.style.backgroundImage =
                `url(${img})`;

            gsap.to(preview,{
                opacity:1,
                duration:0.35,
                ease:"power2.out"
            });

            gsap.to(previewInner,{
                scale:1.05,
                duration:0.8,
                ease:"power3.out"
            });

        });

        item.addEventListener("mouseleave", () => {

            gsap.to(preview,{
                opacity:0,
                duration:0.25
            });

            gsap.to(previewInner,{
                scale:1,
                duration:0.5
            });

        });

        item.addEventListener("mousemove",(e)=>{

            gsap.to(preview,{
                x:e.clientX + 40,
                y:e.clientY - 40,
                duration:0.4,
                ease:"power3.out"
            });

        });

    });

</script>

</body>
</html>
